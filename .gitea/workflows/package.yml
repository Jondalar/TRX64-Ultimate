name: Package

# Stage package: the trx64-ultimate package from the earlier stages (ci/package.sh).
# Called by pipeline.yml (workflow_call) and runnable alone (workflow_dispatch).
# No concurrency group here: a group in a called workflow made every call queue for
# `gateware` again, so another pipeline slipped in between two stages of this one and
# the run sat "waiting" with a stage left (run 351). The group is the pipeline's.
# Run alone, a fragment is not serialised: look at the queue first, as before a push.
on:
  workflow_call:
    inputs:
      ue2:
        description: 'true when the 100T stage follows (keeps the run directory for it)'
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      ue2:
        description: 'true when the 100T stage follows (keeps the run directory for it)'
        type: string
        default: ''

jobs:
  package:
    name: Package
    # Repo variable CI_RUNNER=builder sends every stage to the builder; unset, the NAS
    # runners take them. One machine per run: stages hand over through its /cache.
    runs-on: ${{ vars.CI_RUNNER || 'dockerbuild' }}
    container:
      image: u64-build-env:ci
      # No CPU limit here: each runner sets its own in container.options (NAS --cpus=3, it
      # also runs Gitea; builder none). --init: PID 1 of a job container is `sleep`,
      # which never reaps, and Vivado's helper processes end up as zombies (runs 222, 225)
      options: --init
      volumes:
        - /share/CACHEDEV2_DATA/trx64-build/cache:/cache
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch the source
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          SERVER="${GITHUB_SERVER_URL#*://}"
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "http://actions:${TOKEN}@${SERVER}/${GITHUB_REPOSITORY}.git" src
          git -C src log --oneline -1
      - name: Publish
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
          UE2_INPUT: ${{ inputs.ue2 }}
        run: src/ci/package.sh
