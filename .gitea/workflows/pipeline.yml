name: Pipeline

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tests/**'  # board tests (Python), not part of the build
  workflow_dispatch:
    inputs:
      # 100T stage off (Alex 2026-10-16) until we have a U64 Elite II at home; bit-ue2 below.
      # ue2:
      #   description: 'Also build the Ultimate 64 Elite II (XC7A100T) bitstream, after the package'
      #   type: boolean
      #   default: false
      update:
        description: 'Build the .cfw/.ue2 update files on this branch too (always built on integ-m1, main, v* tags)'
        type: boolean
        default: false

# The chain (docs/specs/T31-ci-pipeline.md), each stage its own workflow file that
# also runs alone:
#   lint -> app -> bitstream 50t -> package -> update, and sims behind the package
#   (bitstream 100t commented out 2026-10-16, see bit-ue2 at the end)
# Nothing here decides anything: what a stage skips (benches that already passed,
# a bitstream whose sources did not change) it decides
# itself from the content of the checkout (ci/select.sh, gateware_key in ci/lib.sh).
# A job-level `if:` is not used for that: in this Gitea a failed stage then leaves
# the jobs behind it blocked and the run "waiting" for ever (run 332).
#
# One pipeline at a time. The group name stays `gateware`: branches that still carry
# the old single-job build.yml use it too, so their runs queue with ours.
concurrency:
  group: gateware
  cancel-in-progress: false

jobs:
  lint:
    uses: ./.gitea/workflows/lint.yml
    secrets: inherit
  app:
    needs: lint
    uses: ./.gitea/workflows/app.yml
    secrets: inherit
  bit-c64u:
    needs: app
    uses: ./.gitea/workflows/bitstream.yml
    with:
      part: 50t
    secrets: inherit
  # The benches run after the package, not in front of it (T31 decision 15, 2026-10-30). They produce nothing the package contains - ci/sims.sh calls neither
  # stage_dir nor need_stage - and in front of it they decided whether the testers get an update
  # file at all: runs 1064 and 1066 spent 44 and 40 minutes in bench timeouts and ended with no
  # artefact, over flash_gate and turbo, which the package does not touch. Behind the package the
  # benches still run on every push and a failing one still makes the run red; the difference is
  # that the files exist by then.
  package:
    needs: [app, bit-c64u]
    uses: ./.gitea/workflows/package.yml
    # with:
    #   ue2: ${{ github.event.inputs.ue2 }}   # 100T stage off, see bit-ue2
    secrets: inherit
  # The tester update files (.cfw/.ue2) of the package, only on integ-m1, main and v* tags (or
  # dispatch with update): elsewhere the stage prints "update SKIPPED" and is green in seconds.
  sims:
    needs: package
    uses: ./.gitea/workflows/sims.yml
    secrets: inherit
  update:
    name: update (.cfw/.ue2)
    needs: package
    uses: ./.gitea/workflows/update.yml
    with:
      force: ${{ github.event.inputs.update }}
    secrets: inherit
  # bit-ue2, the Ultimate 64 Elite II (XC7A100T) bitstream: off (Alex 2026-10-16: "take the 100T
  # out, comment it out; we look at it again when the machine exists and we have one at home").
  # Even skipped it queued for the builder after the update and held the run open. To bring it
  # back: uncomment this job, the ue2 input above and package's `with: ue2`.
  # # The 50T result is out before this starts and never depends on it.
  # bit-ue2:
  #   # Builds only when requested (dispatch with ue2, tag, release/*). When it is not, the
  #   # job is green after about 15 s and its step "bit-ue2 SKIPPED: not requested" says so;
  #   # a job name cannot say it: the name of a job that calls a workflow is not evaluated
  #   # (checked in a probe repo, 2026-10-04), and the stage may not carry an `if:`.
  #   name: bit-ue2 (100T, optional)
  #   needs: update
  #   uses: ./.gitea/workflows/bitstream.yml
  #   with:
  #     part: 100t
  #     ue2: ${{ github.event.inputs.ue2 }}
  #   secrets: inherit
