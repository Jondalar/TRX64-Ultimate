name: Pipeline

# U20 B (MultiCore T239.1, T239.5): the pipeline of this repository on GitHub. Its work is the matrix (matrix.yml: the dispatcher, lint per lane, the
# benches on demand, the bitstream from the builder, the core trx64u, the emulator); a push to main or a v* tag then makes the pre-release of
# trx64u.cor and its two sub-apps in the builds repository (job prerelease, environment `builds`). CI never makes a release: Alex tags,
# tools/release_trx64u.sh publishes.
# The builder (U20 D9: MultiCore's builder, serving N repositories) watches the runs of this file: it reads the work order of the dispatcher,
# builds the missing bitstream entry and releases the environment `bitstreams`, where the bitstream job waits without a runner.
# Pushes of this repository's branches run on `push`; a pull request from a fork runs on `pull_request` (a pull request from a branch of this
# repository is the push's run). A documentation-only push starts no run. scratch/** branches carry the experiments with workflows of their own
# (U20 F: scratch/ephemeral-*; the nightly's scratch/nightly/**), not this pipeline.
# Gitea runs .gitea/workflows only while that directory exists (Gitea's Actions read the first directory of WORKFLOW_DIRS that a commit has,
# .gitea/workflows before .github/workflows): this file runs on GitHub alone.
on:
  push:
    branches: ['**', '!scratch/**']
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
  # The extra part of a dispatched run (GitHub shows the panel only for workflows on the default branch, so it appears with the switch): sims = the
  # benches of the bitstream lane (ci/select.sh sims-demand). A fork pull request cannot be dispatched; it puts "[sims]" into its head commit.
  workflow_dispatch:
    inputs:
      extra:
        description: 'Extra parts of this run: sims = the benches of the bitstream lane, before Vivado'
        type: choice
        options:
          - none
          - sims
        default: none

permissions:
  contents: read

# One run per ref at a time, in the order they started waiting. The group is the branch, or the pull request's head branch.
concurrency:
  group: pipeline-${{ github.head_ref || github.ref }}
  queue: max

jobs:
  matrix:
    # a pull request from a branch of this repository is the push's run; a fork's pull request runs here
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    uses: ./.github/workflows/matrix.yml

  # The pre-release of a push to main or a v* tag (U20 D10, D12, D22): trx64u.cor, trex_crt.u2a, online.u2a and their manifest.json under
  # <prefix><branch>-<sha8> in the builds repository; MultiCore's runners take the three files from there. The environment `builds` lets only those refs in; the job runs the commit's own scripts with the token
  # of that environment, so the push must be one of Alex's (rulesets of main and v* tags).
  prerelease:
    name: Pre-release (trx64u.cor, trex_crt.u2a, online.u2a into the builds repository)
    needs: [matrix]
    if: >-
      ${{ !cancelled() && needs.matrix.result == 'success'
      && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    environment: builds
    container:
      image: ghcr.io/jondalar/trx64u-build@sha256:706a976b56de400970d5af3bac9358d063c1d87defe6a3630d3ed26c5bae0c08
    timeout-minutes: 30
    env:
      CI_BRANCH: ${{ github.ref_name }}
      CI_REF_TYPE: ${{ github.ref_type }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Container paths and git
        # MultiCore T239.1: in a container job the expressions runner.temp and github.workspace can name the host's paths, while $RUNNER_TEMP and
        # $GITHUB_WORKSPACE are the container's; later steps name them as env.CI_TEMP and env.CI_WS. git runs as root on a checkout the runner's
        # user owns and refuses it ("dubious ownership") unless the system config trusts it.
        run: |
          git config --system --add safe.directory '*'
          echo "CI_TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CI_WS=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with:
          name: deliver-trx64u
          path: ${{ env.CI_TEMP }}/deliver
      - name: Pre-release
        env:
          CI_DELIVER_IN: ${{ env.CI_TEMP }}/deliver
          CI_STAGE: ${{ env.CI_TEMP }}/prerelease-stage
          BUILDS_TOKEN: ${{ secrets.BUILDS_TOKEN }}
        run: ci/prerelease.sh

  summary:
    name: Result
    needs: [matrix, prerelease]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Table
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          lines = ["| job | result |", "|---|---|"] + ["| %s | %s |" % (k, v.get("result")) for k, v in needs.items()]
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write("\n".join(lines) + "\n")
          print("\n".join(lines))
          bad = [k for k, v in needs.items() if v.get("result") in ("failure", "cancelled")]
          if bad:
              sys.exit("red: " + ", ".join(bad))
          PY
