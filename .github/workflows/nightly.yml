name: Nightly

# U20 B (MultiCore's nightly.yml form): the benches are on demand in the push pipeline (ci/select.sh sims-demand); once a night every bench of
# ci/sims.txt (tier 2) runs on the default branch, also on demand. The per-bench PASS markers in GitHub's cache skip the benches whose inputs did not
# change, and reading that cache every night keeps the bench ROMs in it alive (entries go after 7 days unused; GitHub stops schedules after 60 days
# without activity). A red nightly is reported, nothing else.
# `schedule` and `workflow_dispatch` need this file on the default branch, which has no workflows until the switch (U20 E). Until then a push to a
# branch scratch/nightly/<name> whose head commit says [nightly] runs it; the marker, the branch pattern and the push trigger go at the switch.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: ['scratch/nightly/**']

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sims:
    name: Benches (tier 2)
    if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[nightly]') }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jondalar/trx64u-sim@sha256:3e366a085f3ff5bfec33b5fa08359a625034038803b8b89f3406691683a625e0
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          persist-credentials: false
      - name: Container paths and git
        # MultiCore T239.1: $RUNNER_TEMP and $GITHUB_WORKSPACE are the container's paths (env.CI_TEMP, env.CI_WS); git trusts the checkout
        run: |
          git config --system --add safe.directory '*'
          echo "CI_TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CI_WS=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Environment
        run: |
          {
            echo "CI_HANDOFF=$RUNNER_TEMP/handoff"
            echo "CI_SIMS_OK=$RUNNER_TEMP/ci-cache/sims-ok"
            echo "ROMS_STORE=$RUNNER_TEMP/ci-cache/roms"
            echo "CI_SIMS_JOBS=$(nproc)"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/handoff" "$RUNNER_TEMP/ci-cache/sims-ok" "$RUNNER_TEMP/ci-cache/roms"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684   # v4.2.3
        with:
          path: ${{ env.CI_TEMP }}/ci-cache
          # the matrix's key family: the nightly and the on-demand runs share their PASS markers
          key: ci-cache-sims-c64_basic-${{ github.sha }}
          restore-keys: |
            ci-cache-sims-c64_basic-
      - name: Benches
        run: ci/sims.sh -t 2
