name: Public tree

# PROVENANCE: TRX64U-MultiCore .github/workflows/public-tree.yml (t239.3 72e770261, last changed in 537a10acd; Alex Damhuis' code in both
# repositories), U20 A8. Changed here: the comments, and the messages are checked without --authors (a contributor's address is theirs; the
# pre-push hook checks the maintainer's own pushes).
# U20 A8 (MultiCore T239.1 D24): the public-tree check (tree, every file of every commit, messages) runs on every push and pull request. No
# paths-ignore on purpose: a documentation-only push can carry a leaked file or an internal address, and pushes from other clones pass no pre-push
# hook. Gitea runs .gitea/workflows only (U20 §6 "B, A7"), so this file does nothing there.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          fetch-depth: 0
      - name: Tree
        run: |
          python3 -I tools/check_public_tree.py --selftest
          python3 -I tools/check_public_tree.py
      - name: Commits and messages
        # Values of the event go through env, never into the script text. The range is the commits of this push that no other branch has:
        # on a new branch or a force push whose old head is not fetched, "before" is no use, so every remote ref except this branch's own
        # (the checkout has just moved it to the new head) is excluded.
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ "$BEFORE" != "$zero" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$GITHUB_SHA"
          else
            range="$GITHUB_SHA"
            while read -r ref sha; do
              [ "$ref" = "refs/remotes/origin/$BRANCH" ] || range="$range ^$sha"
            done < <(git for-each-ref --format='%(refname) %(objectname)' refs/remotes/origin)
          fi
          python3 -I tools/check_public_tree.py --commits "$range"
          python3 -I tools/check_public_tree.py --messages "$range"
