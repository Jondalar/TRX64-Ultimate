# The menu record of the online search (U21; MultiCore T239.3 D12, L-3: the sub-app brings its own tabs). Nothing here is code: the operations and state values are the ones
# online_search.cc registers (online.*). A core that carries online.u2a in its .cor gets both tabs; one that does not has neither.
#  - F3 "Online" (U21 D9: where the search was before): the form. Source first; then the fields of that source (a row of another source is hidden: `hide`); a choice opens
#    a list of its values (`pick = "@state"`, api.md 6.19.3); Search at the foot (`mainfoot`), a job with its busy words (`busy`), greyed without a network (`when_state`);
#    the side panel: the source and the last search.
#  - F3 "Results" (U21 D1): on the strip only while there are results (`show`, api.md 6.11.7). Its list (kind `list`, api.md 6.19) opens the result rows; RETURN on a row
#    calls online.open, the last row of Beyond64 asks online.more for the next page.
# The keys of both tabs, each in the foot legend of its tab (`legend`, api.md 6.18.3), are the `[[key]]` rows at the end: a library's menu record holds them since
# base 3.6 (api.md 6.18.5); the menu merges them behind the core's own rows while the sub-app is loaded.

[[tab]]
area = "F3"
id = "online"
name = "Online"
widget = "nodes"
layout = "split"
n = 3
ui = { title = "@online.ftitle", side = "Search" }

[[tab]]
area = "F3"
id = "results"
name = "Results"
widget = "nodes"
layout = "split"
n = 4
show = "@online.shown"
ui = { title = "@online.title", side = "Search" }

