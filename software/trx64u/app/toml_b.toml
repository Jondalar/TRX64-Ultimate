# TOML B of trx64u's app (MultiCore T239.3 D31, P3-3; U18): what the app of the trx64u core is linked with. The SDK's own way (its README "The app of a
# core", example/app/toml_b.toml): the app is linked from the package's base archive with c64_basic's TOML A (../gateware/c64_basic.toml: the driver
# table and the I/O addresses) and this file (the library table and the sizes), by tools/app_build.py; ../pack_cor.sh runs it.
#
# The core is described by its record (D17): no descriptor is named in [app], the core table of the app is empty and the start makes the descriptor from
# record 6 of trx64u.cor (../base/menu.toml + ../base/desc.toml). Its code is our library trx64u (`hooks = "trx64u"` in desc.toml), which exports the core
# hooks; it and the libraries ring and monitor stay .u2a files in record 7, as the SDK's example keeps its code library.
# `base_sources`: the package's coreapp/cores/portdiag.cc, because the base's run.cc calls portdiag_attach (its descriptor is not in the table).
[app]
name = "trx64u"
base_sources = ["portdiag.cc"]

# No [sizes] key: the maxima stay the headers' defaults (`python3 tools/app_build.py table` lists them), the ones of the shared app trx64u ran on until
# 2026-11-23 (its record: 200 operations, 189 states in base/ops_trx64u.txt, 400 and 320 allowed). Smaller figures wait for a measurement.

# The libraries the app is linked with. All but uci are shared libraries of the package: their tables are the package's libs/shared.toml (sources,
# headers and entries copied from it), the ones trx64u uses. uci is trx64u's own (Alex's split, U18 §5 2026-11-24): its sources are ../uci/, which
# ../pack_cor.sh hands to app_build.py as --src (MultiCore's uci.cc, uci_slot.cc, uci_exports.cc as trxuci*.cc; its export is still "uci"), and
# the command interface server with its NETWORK target, which SDK 0.4.6 handed over (command_intf.cc, network_target.cc; MultiCore T239.3 D48).
# An app has none of the code of a library this file does not name.
#   c64cart, cbm1541, uci, tempdisk, cbmprg: our libraries ask for their tables by name (base/lib_trx64u.cc g_x, ring/ringsys.cc rx_name);
#     cbm1541 also registers the drive operations for the capability drive_a, which desc.toml's caps name; newfile is what cbm1541 needs.
#   dma: the DMA socket service, which runs our dma.* operations (base/lib_trx64u.cc).
#   t64: the T64 list of the menu's .t64 file type (menu.t64).
#   mouse: the 1351 on the POT lines (desc.toml [mouse]); pad, padkeys: the USB gamepads and the pad as keys (menu.toml's pad rows).
#   fastseek, ftp: the file browser's fast seek and its FTP folder.
# Not named: cbmrun (our own c64_go.cc runs programs), newdisk (capabilities floppy and sio, not ours), folderhd (the Amiga's), resample (c64_basic
# decodes no resampler: its TOML A has no block for one), sid (the export "sid" is the SID player's .sid/.mus header code, and the player is gone:
# U20 D6; its resid8.cc is not ours either, base/u64cfg.cc writes reSID8 through the driver table). Online search is no library of the catalog (MultiCore T239.3 L-3): its sub-app online.u2a
# rides in record 7 of trx64u.cor (../sdk.pin online_*, ../pack_cor.sh).

[[library]]
name = "c64cart"
sources = ["c64_cart.cc", "c64cart_exports.cc"]
headers = ["c64_cart.h", "c64_cart_desc.h", "c64cart_api.h"]
bind = "c64cart_bind"

[[library]]
name = "cbm1541"
sources = ["cbm1541.cc", "d1541_drive.cc", "d1541_gcr.cc", "d1541_wd.cc", "cbm1541_exports.cc"]
headers = ["cbm1541.h", "cbm1541_desc.h", "cbm1541_api.h", "d1541_drive.h", "d1541_gcr.h", "d1541_wd.h"]
bind = "cbm1541_bind"
register_ops = "cbm1541_register"
capability = "drive_a"
needs = ["newfile"]

[[library]]
name = "newfile"
sources = ["newfile.cc"]
headers = ["newfile.h"]

[[library]]
name = "uci"
sources = ["trxuci.cc", "trxuci_slot.cc", "trxuci_exports.cc", "command_intf.cc", "network_target.cc"]
headers = ["trxuci.h", "trxuci_slot.h", "trxuci_api.h", "command_intf.h", "command_target.h", "network_target.h"]
bind = "uci_bind"
freeze_request = "uci_take_freeze_request"

[[library]]
name = "tempdisk"
sources = ["tempdisk.cc", "tempdisk_exports.cc"]
headers = ["tempdisk.h", "tempdisk_api.h"]
bind = "tempdisk_bind"
init = "tempdisk_lib_init"

[[library]]
name = "cbmprg"
sources = ["cbm_prg.cc", "cbmprg_exports.cc"]
headers = ["cbm_prg.h", "cbmprg_api.h"]
bind = "cbmprg_bind"

[[library]]
name = "dma"
sources = ["dmasvc.cc"]
headers = ["dmasvc.h"]
start = "dmasvc_start"

[[library]]
name = "t64"
sources = ["t64.cc", "t64_vlist.cc"]
headers = ["t64.h"]
bind = "t64_bind"

[[library]]
name = "mouse"
sources = ["mousesink.cc", "mouse_exports.cc", "mouse_board.cc"]
headers = ["mousesink.h", "mouse_api.h"]
table = "mouse_table"
init = "mouse_lib_init"

[[library]]
name = "pad"
sources = ["pad.cc", "hidpad.cc", "pad_ops.cc", "padwiz.cc", "xinput.cc", "usb_xinput.cc", "pad_exports.cc", "pad_board.cc"]
headers = ["pad.h", "hidpad.h", "xinput.h", "usb_xinput.h", "pad_api.h"]
table = "pad_table"
init = "pad_lib_init"
core = "pad_lib_core"

[[library]]
name = "padkeys"
sources = ["padkeys.cc", "padkeys_exports.cc"]
headers = ["padkeys.h", "padkeys_api.h"]
table = "padkeys_table"

[[library]]
name = "fastseek"
sources = ["fastseek.cc", "fastseek_exports.cc"]
headers = ["fastseek.h", "fastseek_api.h"]
bind = "fastseek_bind"

[[library]]
name = "ftp"
sources = ["ftp_client.cc", "ftp_exports.cc"]
headers = ["ftp_client.h", "ftp_api.h"]
bind = "ftp_bind"
