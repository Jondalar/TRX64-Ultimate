# TOML A of c64_basic (MultiCore T239.3 P1-7, D28, D30, D34; U18): the capabilities of the TRX64 Ultimate bitstream as the app's I/O bus sees them,
# record version 7 ([io], [identity], [[block]]; app/sdkpkg/api.md 6.14 of the SDK). Written from what the RTL of designs/c64_basic decodes (the files
# of its build.tcl), not from a header or a comment; the RTL line that decodes a block is named above it. tools/descrec.py of the SDK generates the
# driver table from it (`descrec.py drivers c64_basic.toml OUT --maps <SDK>/maps`, drvtab.h: DRV_<block>_<property>_*), which our libraries
# take every register address from; rtl_check.py checks it against the RTL (U18 §5 has the command and what it can follow).
#
# The address path: the app RISC-V sends a data access to the I/O bus only when address bit 28 is set (rvlite_wrapper_dc.vhd: bus_converter g_io_bit
# 28; bus_converter.vhd:123), and the I/O bus carries bits 23:0 of it (ultimate_sys.vhd:860-862 decodes io_req.address(23:0)); so iobase is
# 0x10000000. A 16- or 32-bit access is split into byte accesses at rising addresses, byte 0 first, within one CPU access (bus_converter.vhd:56,
# :173-184), which is what the 32-bit registers of trx_sys.v want (bytes 0-2 collect, byte 3 commits; byte 0 latches a read: trx_sys.v:311-323).
#
# owner "base": a block the base or a shared driver library of the SDK drives (identity, the cartridge, the cartridge port, UCI, drive, GCR coder,
# DMA, ROM apertures, the registers the base's io group writes itself; reSID8 by MultiCore's plan, the SID library, although only u64cfg.cc writes
# it today: open, U18 §5). owner "core": a block only trx64u's libraries drive. One block per register range and driver (D34); trx_io.v is cut into
# its pages that way.
#
# Not here: the resampler (0x10100580: ultimate_sys.vhd:1245-1268 decodes 0x101005xx only at 0x00-0x0B and 0x40, 0x41, 0x44, 0x45), and the
# ranges of the four register windows still in desc.toml (audio_mixer, speaker_mixer, c64_palette, hdmi_palette: their owner is open, U18 §5).

[io]
iobase = 0x10000000
u2p_io_base = 0x10100000

[identity]
id = "TRX2"
block = "ident"

# ---- trx_io.v (0x101A0000-0x101AFFFF, ultimate_sys.vhd:873 region r_cw, page = addr[15:12]) ------------------------------------------------------

