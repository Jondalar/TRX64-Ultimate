# ---- ultimate_sys.vhd's own decode --------------------------------------------------------------------------------------------------------------

# 0x10040000: the C64's control page (page RAM, every byte writes and reads back: ultimate_sys.vhd:1232-1233, :1243; the registers: :1076-1108
# write, :1315-1330 read). The cartridge library's map c64cart_regs has mode, stop, type, reu, reu_size and sampler write-only and no stop_mode or
# clock_detect, which trx64u reads and writes; the block carries the page's registers itself, under the map's names and states.
[[block]]
name = "cart_regs"
module = "ultimate_sys"
owner = "base"
address = 0x10040000
size = 0x100
  [[block.property]]
  name = "mode"
  offset = 0x00
  width = 8
  dir = "rw"
    [[block.property.state]]
    name = "normal"
    value = 0
    [[block.property.state]]
    name = "ultimax"
    value = 2
    [[block.property.state]]
    name = "reset"
    value = 4
    [[block.property.state]]
    name = "unreset"
    value = 8
  [[block.property]]
  name = "stop"
  offset = 0x01
  width = 8
  dir = "rw"
    [[block.property.state]]
    name = "run"
    value = 0
    [[block.property.state]]
    name = "stopped"
    value = 1
    [[block.property.field]]
    name = "has_stopped"
    shift = 1
    bits = 1
  [[block.property]]
  name = "stop_mode"
  offset = 0x02
  width = 8
  dir = "rw"
    [[block.property.state]]
    name = "force"
    value = 2
  [[block.property]]
  name = "clock_detect"
  offset = 0x03
  width = 8
  dir = "r"
    [[block.property.field]]
    name = "reset_seen"
    shift = 4
    bits = 1
  [[block.property]]
  name = "type"
  offset = 0x05
  width = 8
  dir = "rw"
  [[block.property]]
  name = "reu"
  offset = 0x08
  width = 8
  dir = "rw"
    [[block.property.state]]
    name = "off"
    value = 0
    [[block.property.state]]
    name = "on"
    value = 1
  [[block.property]]
  name = "reu_size"
  offset = 0x09
  width = 8
  dir = "rw"
    [[block.property.state]]
    name = "mb16"
    value = 7
  [[block.property]]
  name = "sampler"
  offset = 0x0E
  width = 8
  dir = "rw"
    [[block.property.state]]
    name = "off"
    value = 0
    [[block.property.state]]
    name = "on"
    value = 1

# 0x10020000-0x10023FFF: drive A (ultimate_sys.vhd:869-870, drive_unit.vhd, Gideon's c1541_drive). The drive library's map cbm1541 without what
# this drive does not decode: the WD177x registers from +0x1800 (no write reaches them), `side` (it reads a constant 0) and `drivetype`
# (drive_registers.vhd:89-92, :121-124 only with g_multi_mode).
[[block]]
name = "drive_a"
module = "drive_unit"
owner = "base"
address = 0x10020000
size = 0x4000
  [[block.property]]
  name = "power"
  offset = 0x0
  width = 8
  dir = "w"
  [[block.property]]
  name = "reset"
  offset = 0x1
  width = 8
  dir = "w"
  [[block.property]]
  name = "hw_addr"
  offset = 0x2
  width = 8
  dir = "w"
  [[block.property]]
  name = "sensor"
  offset = 0x3
  width = 8
  dir = "w"
    [[block.property.state]]
    name = "dark"
    value = 0
    [[block.property.state]]
    name = "light"
    value = 1
  [[block.property]]
  name = "inserted"
  offset = 0x4
  width = 8
  dir = "w"
    [[block.property.state]]
    name = "no"
    value = 0
    [[block.property.state]]
    name = "yes"
    value = 1
  [[block.property]]
  name = "rammap"
  offset = 0x5
  width = 8
  dir = "w"
  [[block.property]]
  name = "track"
  offset = 0x8
  width = 8
  dir = "r"
  [[block.property]]
  name = "status"
  offset = 0x9
  width = 8
  dir = "r"
    [[block.property.field]]
    name = "motor"
    shift = 0
    bits = 1
    [[block.property.field]]
    name = "writing"
    shift = 1
    bits = 1
    [[block.property.field]]
    name = "writebusy"
    shift = 2
    bits = 1
  [[block.property]]
  name = "diskchange"
  offset = 0xC
  width = 8
  dir = "w"
  [[block.property]]
  name = "dirty"
  offset = 0x800
  width = 8
  count = 128
  dir = "rw"
    [[block.property.field]]
    name = "any"
    shift = 7
    bits = 1
    [[block.property.field]]
    name = "this"
    shift = 0
    bits = 1
  [[block.property]]
  name = "param_addr"
  offset = 0x1000
  width = 32
  count = 256
  stride = 8
  dir = "w"
  [[block.property]]
  name = "param_len"
  offset = 0x1004
  width = 32
  count = 256
  stride = 8
  dir = "w"
    [[block.property.field]]
    name = "length_m1"
    shift = 0
    bits = 16
    [[block.property.field]]
    name = "bit_time"
    shift = 16
    bits = 16

# 0x10044000: the UCI (ultimate_sys.vhd:875-876, uci_unit.vhd), the UCI library's map
[[block]]
name = "cmd_if"
module = "uci_unit"
owner = "base"
address = 0x10044000
size = 0x10
map = "uci"

# 0x10050000: the DMA window into the C64 (ultimate_sys.vhd:877-878, :1003-1022; dma_win.v behind the handshake), the DMA map
[[block]]
name = "dma"
module = "dma_win"
owner = "base"
address = 0x10050000
size = 0x10000
map = "dma"

# 0x10060500: the GCR coder (ultimate_sys.vhd:883-884, Gideon's gcr_codec), the drive library's map
[[block]]
name = "gcr_coder"
module = "gcr_codec"
owner = "base"
address = 0x10060500
size = 0x10
map = "gcr_coder"

# 0x1010000C: the speaker enable of u2p_io (ultimate_sys.vhd:891-892 region r_u2p; u2p_io.vhd:75-77 read, :120-122 write: b0 on, b4:1 volume);
# the rest of the U2P block (I2C, MDIO, the USB hub and ULPI resets) is the base's
[[block]]
name = "speaker_enable"
module = "u2p_io"
owner = "core"
address = 0x1010000C
size = 0x1
  [[block.property]]
  name = "ctrl"
  offset = 0x0
  width = 8
  dir = "rw"
    [[block.property.field]]
    name = "on"
    shift = 0
    bits = 1

# 0x10100400 (page 2, page RAM: ultimate_sys.vhd:901-902, :1232-1233, :1243): the three runs of the U64 block trx64u writes. The bitstream gives
# them no function beyond the page RAM (the page's registers are 0x00, 0x02, 0x03, 0x06, 0x07, 0x0A, 0x0B, 0x0E, 0x0F: :1187-1219, :1331-1347);
# power, RESTORE, the HDMI PLL reset, the keyboard scan and the case LEDs are the base's
[[block]]
name = "u64_userport"
module = "ultimate_sys"
owner = "core"
address = 0x10100405
size = 0x1
  [[block.property]]
  name = "en"
  offset = 0x0
  width = 8
  dir = "rw"

[[block]]
name = "u64_connectors"
module = "ultimate_sys"
owner = "core"
address = 0x10100408
size = 0x2
  [[block.property]]
  name = "hdmi_enable"
  offset = 0x0
  width = 8
  dir = "rw"
  [[block.property]]
  name = "internal"
  offset = 0x1
  width = 8
  dir = "rw"

[[block]]
name = "u64_pwm"
module = "ultimate_sys"
owner = "core"
address = 0x1010040D
size = 0x1
  [[block.property]]
  name = "duty"
  offset = 0x0
  width = 8
  dir = "rw"

# 0x10180000 (page 3, the C64's I/O block, page RAM: ultimate_sys.vhd:905-906, :1109-1180, :1352-1357), one block per register range and driver:
# the base writes the video format (io.video_format), the DMA mode (io.ram_memonly) and the joystick lines; trx64u the rest. Of the video format the
# bitstream acts on ntsc_encoding and cycles_65 (mode_ctl.v:74-75 picks the clock and line timing from them); hz60, rgb_output and ntsc_freq are the
# firmware's bits, kept in the page RAM and read back.
[[block]]
name = "c64_scanlines"
module = "ultimate_sys"
owner = "core"
address = 0x10180000
size = 0x1
  [[block.property]]
  name = "on"
  offset = 0x0
  width = 8
  dir = "rw"

[[block]]
name = "c64_video"
module = "ultimate_sys"
owner = "base"
address = 0x10180001
size = 0x1
  [[block.property]]
  name = "format"
  offset = 0x0
  width = 8
  dir = "rw"
    [[block.property.field]]
    name = "ntsc_encoding"
    shift = 0
    bits = 1
    [[block.property.field]]
    name = "hz60"
    shift = 1
    bits = 1
    [[block.property.field]]
    name = "rgb_output"
    shift = 2
    bits = 1
    [[block.property.field]]
    name = "ntsc_freq"
    shift = 3
    bits = 1
    [[block.property.field]]
    name = "cycles_65"
    shift = 5
    bits = 1

[[block]]
name = "c64_turbo_en"
module = "ultimate_sys"
owner = "core"
address = 0x10180002
size = 0x1
  [[block.property]]
  name = "regs"
  offset = 0x0
  width = 8
  dir = "rw"

[[block]]
name = "c64_dma_mode"
module = "ultimate_sys"
owner = "base"
address = 0x10180003
size = 0x1
  [[block.property]]
  name = "memonly"
  offset = 0x0
  width = 8
  dir = "rw"

# +0x05: page RAM only (no register of the bitstream reads it); trx64u writes the colour timing's phase increment there as the firmware does
[[block]]
name = "c64_phase"
module = "ultimate_sys"
owner = "core"
address = 0x10180005
size = 0x1
  [[block.property]]
  name = "incr"
  offset = 0x0
  width = 8
  dir = "rw"

# +0x08-0x0F: the addresses of the two SID sockets and the two UltiSIDs (:1160-1163, :1171-1174), each a run of four in that order: socket 1,
# socket 2, UltiSID 1, UltiSID 2
[[block]]
name = "c64_sid_addr"
module = "ultimate_sys"
owner = "core"
address = 0x10180008
size = 0x8
  [[block.property]]
  name = "base"
  offset = 0x0
  width = 8
  count = 4
  dir = "rw"
  [[block.property]]
  name = "mask"
  offset = 0x4
  width = 8
  count = 4
  dir = "rw"

# +0x11-0x14: the sockets' enables (:1175-1176), the paddles (page RAM only) and the stereo address select (:1177)
[[block]]
name = "c64_sid_sock"
module = "ultimate_sys"
owner = "core"
address = 0x10180011
size = 0x4
  [[block.property]]
  name = "socket1_en"
  offset = 0x0
  width = 8
  dir = "rw"
  [[block.property]]
  name = "socket2_en"
  offset = 0x1
  width = 8
  dir = "rw"
  [[block.property]]
  name = "paddle_en"
  offset = 0x2
  width = 8
  dir = "rw"
  [[block.property]]
  name = "stereo_addrsel"
  offset = 0x3
  width = 8
  dir = "rw"

# +0x20-0x29: the UltiSIDs' waveforms, resonance, digis and split (:1164-1170)
[[block]]
name = "c64_sid_cfg"
module = "ultimate_sys"
owner = "core"
address = 0x10180020
size = 0xA
  [[block.property]]
  name = "waves1"
  offset = 0x0
  width = 8
  dir = "rw"
  [[block.property]]
  name = "waves2"
  offset = 0x1
  width = 8
  dir = "rw"
  [[block.property]]
  name = "res1"
  offset = 0x2
  width = 8
  dir = "rw"
  [[block.property]]
  name = "res2"
  offset = 0x3
  width = 8
  dir = "rw"
  [[block.property]]
  name = "digi1"
  offset = 0x7
  width = 8
  dir = "rw"
  [[block.property]]
  name = "digi2"
  offset = 0x8
  width = 8
  dir = "rw"
  [[block.property]]
  name = "split"
  offset = 0x9
  width = 8
  dir = "rw"

# +0x2A-0x2E: the bus bridge (page RAM only), the bus sharing (:1137-1144) and the turbo's speed (:1153-1154)
[[block]]
name = "c64_bus"
module = "ultimate_sys"
