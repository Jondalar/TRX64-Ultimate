# 0x10181800 (page 5): U64_DEBUG_REGISTER, its own byte at +0 (ultimate_sys.vhd:1235-1242, :1348-1351), the DMA service's
[[block]]
name = "c64_debug"
module = "ultimate_sys"
owner = "base"
address = 0x10181800
size = 0x10
  [[block.property]]
  name = "debug"
  offset = 0x00
  width = 8
  dir = "rw"

# 0x10188000-0x1018FFFF: the ROM apertures (ultimate_sys.vhd:911-912, :1023-1043; dma_win.v): BASIC at +0x0000, KERNAL at +0x2000, the character
# ROM at +0x4000 (4 KB, mirrored up to +0x6FFF). The base's io group writes and reads them (io.rom_write, io.rom_read).
[[block]]
name = "c64_roms"
module = "dma_win"
owner = "base"
address = 0x10188000
size = 0x5000
  [[block.property]]
  name = "basic"
  offset = 0x0000
  width = 8
  count = 8192
  dir = "rw"
  [[block.property]]
  name = "kernal"
  offset = 0x2000
  width = 8
  count = 8192
  dir = "rw"
  [[block.property]]
  name = "char"
  offset = 0x4000
  width = 8
  count = 4096
  dir = "rw"
