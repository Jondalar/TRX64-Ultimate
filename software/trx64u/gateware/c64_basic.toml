# page 0 0x040-0x04D: the reSID8 filter control of the two UltiSIDs' engines (trx_io.v:277-290 write, :351-364 read; rs8_cfg :188-189 goes to the SID
# engine, top.v:828, :1380). Per engine u = 0, 1: fcsel the cutoff source (c64_redip_sid/sid_multi.sv:105, reDIP-SID/gateware/sid_filter.sv:260: 0 the
# chip model's own, 1 the 6581 curve, 2 the 8580's), auto b0 the resonance and b1 the digis follow the chip model (sid_multi.sv:103-104), the 6581
# curve's base (9 bits) and offset (11 bits) as 16-bit registers, low byte first, the two engines' pairs interleaved (stride 4), bypass b0 the filter
# off. Written by u64cfg.cc (trx64u's SID settings); the names are those of the SDK's map `sid`.
